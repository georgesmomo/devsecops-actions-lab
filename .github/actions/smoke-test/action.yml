# Local COMPOSITE action: reusable in any job via `uses: ./.github/actions/smoke-test`
name: Smoke test Kubernetes
description: Exposes a Service through port-forward and checks the HTTP response
inputs:
  service:
    description: Kubernetes Service name
    required: true
  path:
    description: HTTP path to test
    default: /healthz
  expected:
    description: Text expected in the response
    default: ok
outputs:
  response:
    description: HTTP response body
    value: ${{ steps.call.outputs.response }}
runs:
  using: composite
  steps:
    - name: HTTP call
      id: call
      shell: bash
      env:
        SVC: ${{ inputs.service }}
        URL_PATH: ${{ inputs.path }}
        EXPECTED: ${{ inputs.expected }}
      run: |
        kubectl port-forward "svc/${SVC}" 18080:80 >/tmp/pf.log 2>&1 &
        for i in $(seq 1 20); do
          if body=$(curl -fsS "http://127.0.0.1:18080${URL_PATH}"); then break; fi
          sleep 2
        done
        echo "Response: ${body}"
        echo "response=${body}" >> "$GITHUB_OUTPUT"
        if [[ "${body}" != *"${EXPECTED}"* ]]; then
          echo "::error title=Smoke test::unexpected response on ${URL_PATH}"
          exit 1
        fi
        echo "::notice title=Smoke test::${SVC}${URL_PATH} responds correctly"
