# Workflow REUTILISABLE (on: workflow_call) : build -> scan -> push -> SBOM -> signature -> attestation.
name: Reusable - Docker build, scan & sign

on:
  workflow_call:
    inputs:
      push:
        description: "Pousser l'image sur GHCR ?"
        type: boolean
        default: false
    outputs:
      digest:
        description: "Digest sha256 de l'image poussee"
        value: ${{ jobs.build.outputs.digest }}
      image:
        description: "Nom de l'image (sans tag)"
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read

jobs:
  build:
    name: Build, scan & sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # pousser sur ghcr.io
      security-events: write   # publier le rapport Trivy (SARIF)
      id-token: write          # OIDC -> certificat Sigstore (signature sans cle)
      attestations: write      # attestation de provenance SLSA
      artifact-metadata: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Nom d'image en minuscules
        id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Tags et labels OCI
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # 1) Build local (pas encore pousse) pour scanner AVANT publication
      - name: Build (local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: lab-api:scan
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) Scan de vulnerabilites : rapport complet vers l'onglet Security
      - name: Trivy - rapport SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lab-api:scan
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          exit-code: "0"
      - name: Publier SARIF dans Code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      # 3) Security gate : on bloque le pipeline si une CVE CRITIQUE corrigeable existe
      - name: Trivy - gate CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lab-api:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      # 4) Publication sur GitHub Container Registry
      - name: Login GHCR
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        id: push
        if: inputs.push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha

      # 5) SBOM (inventaire des composants) + signature + attestations
      - name: SBOM (Syft, SPDX)
        if: inputs.push
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.vars.outputs.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: inputs.push
      - name: Signature keyless (cosign + OIDC)
        if: inputs.push
        run: cosign sign --yes "${{ steps.vars.outputs.image }}@${{ steps.push.outputs.digest }}"

      - name: Attestation de provenance (SLSA)
        if: inputs.push
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.vars.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attestation SBOM
        if: inputs.push
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.vars.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Resume
        if: inputs.push
        run: |
          {
            echo "## Image publiee"
            echo "| Champ | Valeur |"
            echo "|---|---|"
            echo "| Image | \`${{ steps.vars.outputs.image }}\` |"
            echo "| Digest | \`${{ steps.push.outputs.digest }}\` |"
            echo "| Tags | ${{ join(fromJSON(steps.meta.outputs.json).tags, ', ') }} |"
          } >> "$GITHUB_STEP_SUMMARY"
