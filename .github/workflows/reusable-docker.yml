# REUSABLE workflow (on: workflow_call): build -> scan -> push -> SBOM -> signature -> attestation.
name: Reusable - Docker build, scan & sign

on:
  workflow_call:
    inputs:
      push:
        description: "Push the image to GHCR?"
        type: boolean
        default: false
    outputs:
      digest:
        description: "sha256 digest of the pushed image"
        value: ${{ jobs.build.outputs.digest }}
      image:
        description: "Image name (without tag)"
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read

jobs:
  build:
    name: Build, scan & sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to ghcr.io
      security-events: write   # publish the Trivy report (SARIF)
      id-token: write          # OIDC -> Sigstore certificate (keyless signing)
      attestations: write      # SLSA provenance attestation
      artifact-metadata: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lowercase image name
        id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: OCI tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # 1) Local build (not pushed yet) so we scan BEFORE publishing
      - name: Build (local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: lab-api:scan
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) Vulnerability scan: full report to the Security tab
      - name: Trivy - SARIF report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lab-api:scan
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      # 3) Security gate: block the pipeline if a fixable CRITICAL CVE exists
      - name: Trivy - gate CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lab-api:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      # 4) Publish to GitHub Container Registry
      - name: Login GHCR
        if: inputs.push
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        id: push
        if: inputs.push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha

      # 5) SBOM (component inventory) + signature + attestations
      - name: SBOM (Syft, SPDX)
        if: inputs.push
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.vars.outputs.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: inputs.push
      - name: Signature keyless (cosign + OIDC)
        if: inputs.push
        run: cosign sign --yes "${{ steps.vars.outputs.image }}@${{ steps.push.outputs.digest }}"

      - name: Provenance attestation (SLSA)
        if: inputs.push
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.vars.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attestation SBOM
        if: inputs.push
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.vars.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Summary
        if: inputs.push
        run: |
          {
            echo "## Image published"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image | \`${{ steps.vars.outputs.image }}\` |"
            echo "| Digest | \`${{ steps.push.outputs.digest }}\` |"
            echo "| Tags | ${{ join(fromJSON(steps.meta.outputs.json).tags, ', ') }} |"
          } >> "$GITHUB_STEP_SUMMARY"
