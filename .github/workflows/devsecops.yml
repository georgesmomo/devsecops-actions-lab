# Pipeline principal : CI -> build/scan/sign -> verification -> deploiement Kubernetes (kind).
name: DevSecOps Pipeline

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "app/**"
      - "Dockerfile"
      - "k8s/**"
      - ".github/workflows/devsecops.yml"
      - ".github/workflows/reusable-docker.yml"
      - ".github/workflows/ci.yml"
      - ".github/actions/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement cible"
        type: choice
        options: [staging, production]
        default: staging
      skip-deploy:
        description: "Construire sans deployer"
        type: boolean
        default: false

# Aucun droit par defaut : chaque job declare exactement ce dont il a besoin.
permissions: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # ne jamais couper un deploiement en cours

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: write

  build:
    name: Image
    needs: ci
    uses: ./.github/workflows/reusable-docker.yml
    with:
      push: true
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
      artifact-metadata: write

  deploy:
    name: Deploy (${{ inputs.environment || 'staging' }})
    needs: build
    if: ${{ !inputs.skip-deploy }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'staging' }}
      url: https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }}
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
      LOCAL_TAG: lab-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login GHCR (lecture)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Zero trust : on ne deploie que ce qu'on a verifie
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verifier la signature cosign
        run: |
          cosign verify "$IMAGE" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "Signature valide pour $IMAGE"
      - name: Verifier l'attestation de provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "oci://$IMAGE" --repo "$GITHUB_REPOSITORY"

      - name: Creer un cluster Kubernetes ephemere (kind)
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      - name: Charger l'image verifiee dans le cluster
        run: |
          docker pull "$IMAGE"
          docker tag "$IMAGE" "$LOCAL_TAG"
          kind load docker-image "$LOCAL_TAG" --name chart-testing

      - name: Deployer
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|${LOCAL_TAG}|" k8s/deployment.yaml
          kubectl apply -f k8s/
          kubectl rollout status deployment/lab-api --timeout=180s
          kubectl get pods -o wide

      - name: Smoke test
        uses: ./.github/actions/smoke-test
        with:
          service: lab-api

      - name: Resume du deploiement
        run: |
          {
            echo "## Deploiement ${{ inputs.environment || 'staging' }} OK"
            echo "- Image : \`$IMAGE\`"
            echo "- Signature cosign : verifiee"
            echo "- Provenance SLSA : verifiee"
            echo '```'
            kubectl get deploy,svc,pods
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
